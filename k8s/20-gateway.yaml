apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: foodflow
spec:
  replicas: 2
  selector:
    matchLabels: { app: gateway }
  template:
    metadata:
      labels: { app: gateway }
    spec:
      containers:
        - name: gateway
          image: foodflow/gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4000
          envFrom:
            - configMapRef: { name: foodflow-config }
            - secretRef: { name: foodflow-secrets }
          env:
            - name: SERVICE_NAME
              value: gateway
          readinessProbe:
            tcpSocket: { port: 4000 }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            tcpSocket: { port: 4000 }
            initialDelaySeconds: 90
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { cpu: 300m, memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: foodflow
spec:
  selector: { app: gateway }
  ports:
    - port: 4000
      targetPort: 4000
