apiVersion: apps/v1
kind: Deployment
metadata:
  name: client
  namespace: foodflow
spec:
  replicas: 1
  selector:
    matchLabels: { app: client }
  template:
    metadata:
      labels: { app: client }
    spec:
      containers:
        - name: client
          image: foodflow/client:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { cpu: 100m, memory: 64Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: client
  namespace: foodflow
spec:
  type: NodePort
  selector: { app: client }
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
