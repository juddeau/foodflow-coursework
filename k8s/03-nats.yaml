apiVersion: apps/v1
kind: Deployment
metadata:
  name: nats
  namespace: foodflow
spec:
  replicas: 1
  selector:
    matchLabels: { app: nats }
  template:
    metadata:
      labels: { app: nats }
    spec:
      containers:
        - name: nats
          image: nats:2.10-alpine
          args: ["-m", "8222"]
          ports:
            - containerPort: 4222
            - containerPort: 8222
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 200m, memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: nats
  namespace: foodflow
spec:
  selector: { app: nats }
  ports:
    - name: client
      port: 4222
    - name: monitor
      port: 8222
