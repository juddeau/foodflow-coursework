apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-service
  namespace: foodflow
spec:
  replicas: 2
  selector:
    matchLabels: { app: orders-service }
  template:
    metadata:
      labels: { app: orders-service }
    spec:
      containers:
        - name: orders-service
          image: foodflow/orders-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4000
          envFrom:
            - configMapRef: { name: foodflow-config }
            - secretRef: { name: foodflow-secrets }
          env:
            - name: SERVICE_NAME
              value: orders-service
            - name: MONGO_URI
              value: mongodb://mongo:27017/orders_db
          readinessProbe:
            tcpSocket: { port: 4000 }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            tcpSocket: { port: 4000 }
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { cpu: 300m, memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: orders-service
  namespace: foodflow
spec:
  selector: { app: orders-service }
  ports:
    - port: 4000
      targetPort: 4000
---
# Горизонтальное масштабирование сервиса заказов по загрузке CPU (часы пик)
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: orders-service
  namespace: foodflow
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: orders-service
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
