name: Проверка FoodFlow
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        directory: [gateway, client, services/users-service, services/restaurants-service, services/orders-service, services/delivery-service]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: npm ci
        working-directory: ${{ matrix.directory }}
      - run: npm run build
        working-directory: ${{ matrix.directory }}
      - run: npm test
        if: matrix.directory == 'services/orders-service'
        working-directory: ${{ matrix.directory }}
  integration:
    needs: build
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1}).ok'"
          --health-interval 5s --health-timeout 5s --health-retries 20
      nats:
        image: nats:2.10-alpine
        ports: ['4222:4222']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install and build APIs
        run: |
          for component in users restaurants orders delivery; do
            (cd services/$component-service && npm ci && npm run build)
          done
          (cd gateway && npm ci && npm run build)
      - name: Start services and verify actual API requests
        run: bash scripts/ci-integration.sh
